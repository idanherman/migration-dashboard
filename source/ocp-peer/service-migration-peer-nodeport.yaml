apiVersion: v1
kind: Service
metadata:
  name: migration-peer-nodeport
  namespace: migration-test-system  # Override via deploy script / NAMESPACE
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: migration-peer
  ports:
    - port: 8080
      targetPort: 8080
      name: ws
    - port: 8081
      targetPort: 8081
      name: tcp
    - port: 8082
      targetPort: 8082
      name: http
